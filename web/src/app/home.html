<!--
  Two layouts share one Leaflet map instance (a single #mapEl) and one
  <app-results-list>. The layout is selected by the `app--desktop` / `app--mobile`
  class; the CSS for each lives in clearly separated blocks in home.css.

  - Mobile:  header + slider on top, map (~45% height), scrollable list below.
  - Desktop: map full width on top, results list underneath (page scrolls).
-->
<div class="app" [class.app--desktop]="isDesktop()" [class.app--mobile]="!isDesktop()">
  <header class="app__header">
    <h1 class="app__title">MountainRadar</h1>
    <p class="app__subtitle">One Search. More Conditions.</p>
  </header>

  <div class="range">
    <span class="range__label">Alle</span>
    <input
      type="range"
      class="range__slider"
      min="0"
      [max]="steps.length - 1"
      step="1"
      [value]="rangeIndex()"
      (input)="onRangeInput($event)"
      aria-label="Datumsbereich"
    />
    <span class="range__value">{{ currentStep.label }}</span>
  </div>

  <div class="content">
    <div class="map-wrap">
      <div #mapEl class="map" role="application" aria-label="Karte mit Ergebnissen"></div>
      @if (loading()) {
        <div class="map__loading">Lade…</div>
      }
    </div>

    <section class="results">
      <p class="results__count">{{ results().length }} Ergebnisse</p>
      <app-results-list
        [reports]="orderedResults()"
        [selectedId]="selectedId()"
        (select)="selectReport($event)"
        (hover)="highlightPin($event)"
        (hoverEnd)="unhighlightPin($event)"
        (open)="openReport($event)"
      />
    </section>
  </div>
</div>
